name: Build Premiere Flamengo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Premiere_Flamengo_Projeto_Android.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -q Premiere_Flamengo_Projeto_Android.zip -d projeto

      - name: Compilar APK
        run: gradle -p projeto/PremiereFlamengoAndroid assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Premiere-Flamengo-APK
          path: projeto/PremiereFlamengoAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
